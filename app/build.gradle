plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.csci3130group1'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.csci3130group1"
        minSdk 25
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        dataBinding = true
    }
}

dependencies {
    implementation libs.firebase.database.v2021
    implementation libs.firebase.auth.v2212
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.google.firebase.auth
    implementation libs.google.auth.library.oauth2.http
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.auth
    implementation libs.security.crypto
    implementation libs.firebase.firestore
    implementation libs.firebase.database
    implementation 'com.google.firebase:firebase-storage:20.3.0'
    implementation libs.uiautomator
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.navigation.runtime
    implementation libs.fragment.testing
    implementation libs.play.services.location
    implementation libs.firebase.messaging
    implementation libs.volley
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    debugImplementation "androidx.test:monitor:1.7.2"

    // Espresso and Hamcrest testing dependencies
    androidTestImplementation 'androidx.test:rules:1.6.1'


    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.5.1'
    androidTestImplementation 'org.mockito:mockito-android:4.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'

    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'


    //    Google Maps & Places
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.libraries.places:places:3.3.0'

    //    Paypal
    implementation 'com.paypal.sdk:paypal-android-sdk:2.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    //    Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    //    Community Feature
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

apply plugin: 'com.google.gms.google-services'

// Work around duplicate class files caused by iCloud Drive "… 2" folder copies
// before dexing. This is a local hygiene step and safe to keep.
tasks.register("purgeDuplicateClassDirs") {
    group = "build setup"
    description = "Delete any '* 2' class folders under intermediates/javac."
    doLast {
        def javacRoot = file("$buildDir/intermediates/javac")
        if (javacRoot.exists()) {
            fileTree(javacRoot) {
                include "**/* 2"
                include "**/* 2/**"
            }.files.sort { -it.absolutePath.length() } // delete deepest first
             .each { f ->
                if (f.isDirectory()) {
                    f.deleteDir()
                } else {
                    f.delete()
                }
            }
        }
    }
}

// Ensure the cleanup runs before dexing for all variants
tasks.matching { it.name.startsWith("dexBuilder") }.configureEach {
    dependsOn tasks.named("purgeDuplicateClassDirs")
}
